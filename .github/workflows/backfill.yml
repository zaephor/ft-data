name: Backfill

on:
  workflow_dispatch:
    inputs:
      timerange:
        description: 'Timerange'
        required: true
        default: '20200101-'

jobs:
  backfill:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        exchange:
        - binance
        - binanceus
        - binanceje
        - bittrex
        - coinbasepro

    steps:
    - name: Git checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 1

    - name: Git checkout data branch
      uses: actions/checkout@v2
      with:
        fetch-depth: 1
        ref: ${{ matrix.exchange }}
        path: ${{ matrix.exchange }}

    - name: Setup Docker
      uses: docker-practice/actions-setup-docker@master
      with:
        docker_version: 19.03
        docker_channel: stable

    - name: Update data
      run: bash freq.sh backfill ${{ matrix.exchange }} ${{ github.event.inputs.timerange }}

    - name: Push changes
      run: |
          cd ${{ matrix.exchange }}
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Autoupdate: $(date +%Y-%m-%d)"
          git push
